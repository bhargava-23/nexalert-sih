[project]
name = "nexalert-db"
version = "0.1.0"
description = "NexAlert database migrations and schema"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.12.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"
