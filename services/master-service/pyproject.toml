[project]
name = "nexalert-master-service"
version = "0.1.0"
description = "NexAlert Raspberry Pi Master service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nexalert-events",
    "nexalert-config",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
