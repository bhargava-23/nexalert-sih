version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: nexalert-postgres
    environment:
      POSTGRES_DB: nexalert_dev
      POSTGRES_USER: nexalert
      POSTGRES_PASSWORD: nexalert_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexalert"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
